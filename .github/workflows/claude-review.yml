name: Claude PR review

# Manual only: Actions tab → "Claude PR review" → Run workflow.
# Auth: needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (run `claude setup-token`
# locally; see the PR/commit notes). Usage counts against the Claude subscription.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      model:
        description: Model passed to --model
        required: false
        default: claude-sonnet-5-5
        type: string
      max_turns:
        description: Cap on agent turns (also caps cost)
        required: false
        default: '10'
        type: string
      focus:
        description: Extra review instructions appended to the prompt
        required: false
        default: ''
        type: string
      debug:
        description: Print the full Claude output in the log (may expose file contents)
        required: false
        default: false
        type: boolean
      extra_args:
        description: Extra Claude Code CLI flags (e.g. --fallback-model claude-haiku-5-5)
        required: false
        default: ''
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Review this pull request for bugs, security issues and missing tests,
            following the conventions in AGENTS.md. Use `gh pr diff` and
            `gh pr view` to read it. Comment inline on specific lines and finish
            with one short summary comment. Be concise.

            ${{ inputs.focus }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            ${{ inputs.extra_args }}
